[package]
name = "harness-lens"
version = "0.5.0"
description = "Local-first Agent Harness DevTools"
authors = ["Zane"]
edition = "2021"
license = "MIT"
repository = "https://github.com/zhanhaoyu99/harness-lens"
homepage = "https://github.com/zhanhaoyu99/harness-lens"
readme = "../README.md"
rust-version = "1.88"

[lib]
name = "harness_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "harness-lens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
fs2 = "0.4"
hex = "0.4"
regex = "1"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
